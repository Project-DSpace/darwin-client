# Checks formatting and lints, runs the unit tests, then builds the Linux `darwin`
# client binary (from the ant-cli crate) on every push to main and uploads it as
# the `darwin-linux-x64` workflow artifact.
#
# Replaces upstream's workflows, which run Autonomi's test matrix, PR checks
# and signed multi-platform releases.

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  linux-x64:
    # Pinned to the servers' Ubuntu release: a binary built against a newer
    # glibc will not run on an older one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --locked -p ant-core --lib && cargo test --locked -p ant-cli

      - name: Build
        run: cargo build --release --locked -p ant-cli --bin darwin

      - name: Package
        run: |
          mkdir dist
          cp target/release/darwin dist/
          tar -C dist -czf darwin-linux-x64.tar.gz .
          sha256sum darwin-linux-x64.tar.gz > SHA256SUMS.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: darwin-linux-x64
          path: |
            darwin-linux-x64.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
