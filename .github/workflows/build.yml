# Builds the Linux `ant` client binary on every push to main and publishes it
# as a pre-release named after the commit.
#
# Replaces upstream's workflows, which run Autonomi's test matrix, PR checks
# and signed multi-platform releases.

name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x64:
    # Pinned to the servers' Ubuntu release: a binary built against a newer
    # glibc will not run on an older one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p ant-cli --bin ant

      - name: Package
        run: |
          mkdir dist
          cp target/release/ant dist/
          tar -C dist -czf ant-linux-x64.tar.gz .
          sha256sum ant-linux-x64.tar.gz > SHA256SUMS.txt

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_SHA::7}"
          gh release create "$tag" ant-linux-x64.tar.gz SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "$tag" --notes "Built from $GITHUB_SHA"
