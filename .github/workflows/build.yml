# Checks formatting and lints, runs the unit tests, the test targets that need
# no nodes and the vendored crates' own tests, then builds the Linux `darwin`
# client binary (from the ant-cli crate) and uploads it,
# with its licence files and third-party notices, as the `darwin-linux-x64`
# workflow artifact. Also checks that upstream's installers stay deleted, that
# the darwin-node revision the tests run is pinned alike everywhere, with
# vendor/ant-protocol equal to its copy, and that the release gate holds
# (scripts/check-workflows.sh).
#
# The artifact is CI output, made whether or not test.yml's end-to-end and
# browser tests pass: for trying a commit, not for deployment. Deployments
# take a release, which release.yml publishes from this artifact only once
# the tagged commit's Build and Test runs both succeeded.
#
# Runs on every push, to any branch, and on pull requests, so a merge branch
# is checked before it lands; test.yml runs the end-to-end and browser tests.
# Actions are pinned by commit.
#
# Replaces upstream's workflows, which run Autonomi's test matrix, PR checks
# and signed multi-platform releases.

name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Upstream's installers (install.sh, install.ps1), npm packages, winget
  # manifest and release-signing key install or verify Autonomi's `ant`, not
  # `darwin`, and the installers write Autonomi's seeds into the config
  # directory `darwin` shares. They are deleted; a merge of upstream must keep
  # them deleted.
  upstream-installers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Upstream's installers stay deleted
        run: |
          tracked=$(git ls-files -- install.sh install.ps1 npm resources/winget resources/release-signing-key.pub)
          if [ -n "$tracked" ]; then
            echo "Upstream's installers are tracked again; they install Autonomi's ant, not darwin. Delete them:"
            echo "$tracked"
            exit 1
          fi

      # The vendored ant-listings is darwin-listings v0.4.0 unchanged; the ids
      # it was vendored at are in its VENDORED.md.
      - name: Vendored ant-listings is unchanged
        run: |
          for path in src Cargo.toml; do
            want=$(grep -oE "^#   ${path%.toml}[^:]*: +[0-9a-f]{40}" vendor/ant-listings/VENDORED.md | grep -oE '[0-9a-f]{40}')
            have=$(git rev-parse "HEAD:vendor/ant-listings/$path")
            if [ "$want" != "$have" ]; then
              echo "vendor/ant-listings/$path is $have, VENDORED.md records '$want'"
              exit 1
            fi
          done

      # ant-core's tests and devnet build darwin-node at one revision, which
      # browser-tests/node-revision, ant-core/Cargo.toml, the webrtc patch and
      # Cargo.lock must all name. The workspace's [patch] builds that
      # darwin-node against this repository's vendor/ant-protocol, so a copy
      # that drifted from darwin-node's would never show in a build: the
      # script fetches the revision and compares the two as git trees, every
      # file byte for byte as committed.
      - name: One darwin-node revision, and vendor/ant-protocol is its copy
        run: python3 scripts/darwin-node-pin.py --vendored

      # The release gate: release.yml publishes a client only after the
      # tagged commit's Test and Build runs succeeded, and those runs carry
      # every pin. The script says what it checks; test.yml runs its tests.
      - name: Run the release gate's check
        run: bash scripts/check-workflows.sh

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  linux-x64:
    # Pinned to the servers' Ubuntu release: a binary built against a newer
    # glibc will not run on an older one.
    runs-on: ubuntu-24.04
    # Line tables only, not full debug info, for the test builds (the release
    # build has none), so they fit on the runner's disk with the vendored
    # crates' builds; backtraces still give file and line.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The test builds and the release build together can fill the runner's
      # disk otherwise, as test.yml's builds did. This job uses none of these
      # preinstalled toolchains.
      - name: Free disk space
        run: |
          df -h /
          for dir in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; do
            if [ -d "$dir" ]; then sudo rm -rf "$dir"; fi
          done
          df -h /

      - name: Unit tests
        run: cargo test --locked -p ant-core --lib && cargo test --locked -p ant-cli

      # ant-core's test targets that start neither nodes nor a chain, as
      # scripts/test-targets.py lists them (test.yml runs the rest, against
      # darwin-node): the node manager's integration tests among them. The
      # script fails first if a test target would be neither run nor skipped.
      - name: Test targets that need no nodes
        run: |
          targets=$(python3 scripts/test-targets.py no-nodes)
          cargo test --locked -p ant-core --no-fail-fast $targets

      # vendor/ant-listings' own tests, under this repository's Cargo.lock: a
      # dependency this lock resolves differently from darwin-listings' fails
      # here.
      - name: Vendored ant-listings
        run: cargo test --locked -p ant-listings

      # vendor/ant-protocol's payment tests, below, start Anvil. Pinned, as
      # test.yml pins it.
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5

      # vendor/ant-protocol's own tests, under its own Cargo.lock (it is outside
      # the workspace), so pins written beside its functions run. Built in this
      # workspace's target directory, which the cache keeps.
      - name: Vendored ant-protocol
        run: cargo test --locked --manifest-path vendor/ant-protocol/Cargo.toml --target-dir target

      # Only darwin-node's image build ships darwin-nodes, the storage-node
      # image's node manager, from the darwin-client commit it pins. This
      # build makes it beside `darwin` (one more link) only to check it as
      # built for release, where the linker leaves out code it never reaches
      # (scripts/check-darwin-nodes.sh; ant-cli/tests/darwin_nodes.rs checks
      # the same strings in the test build), and never packages it.
      - name: Build
        run: cargo build --release --locked -p ant-cli --bin darwin --bin darwin-nodes

      - name: The release darwin-nodes has no Autonomi address, reset or log forwarding
        run: bash scripts/check-darwin-nodes.sh target/release/darwin-nodes

      # Collects, unaltered, the licence, copyright and notice files of every
      # crate the build resolves for this target, including build-time tools
      # and OpenSSL, and fails if any crate's licence is outside the policy or
      # its texts cannot be found (see the script and its config). The token
      # raises the GitHub rate limit for licence files fetched from crates'
      # repositories. Ubuntu 24.04's python3 is 3.12; the script needs 3.11+.
      - name: Generate THIRD-PARTY-NOTICES.txt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/third_party_notices/generate.py
          --package ant-cli
          --target x86_64-unknown-linux-gnu
          --config scripts/third_party_notices/config.toml
          --output THIRD-PARTY-NOTICES.txt

      # As in upstream's release archives: the binary, the project's licence
      # files, the third-party notices and the Rust standard library's notices
      # from the toolchain that built the binary. Files sit at the archive's
      # root, so `darwin` is where it always was.
      - name: Package
        run: |
          mkdir dist
          cp target/release/darwin dist/
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.txt dist/
          cp "$(rustc --print sysroot)/share/doc/rust/COPYRIGHT-library.html" dist/RUST-STD-COPYRIGHT.html
          tar -C dist -czf darwin-linux-x64.tar.gz .
          sha256sum darwin-linux-x64.tar.gz > SHA256SUMS.txt

      # CI output, not for deployment (see the top of this file). release.yml
      # takes it from a push to main's run, as the release, once that commit's
      # Build and Test runs both succeeded.
      - name: Upload the CI build (not for deployment)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: darwin-linux-x64
          path: |
            darwin-linux-x64.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
