# The payment chain the client uses by default (and as --evm-network
# robinhood). Switching tokens means changing the two addresses, the vault's
# deployment block and time, the time of its first payment and the symbol
# here and rebuilding; switching chains, the RPC URLs and chain_id too. The
# nodes take the addresses from their node.env.
#
# Robinhood Chain mainnet (chain ID 4663), through PublicNode's free RPC. Robinhood's
# own public RPC load-balances over servers at different heights and failed
# mid-payment in testing;
# heavy users can point at their own provider with a devnet manifest, giving
# its evm block "chain_id": 4663 so their payments are checked as below.
rpc_url = "https://robinhood-rpc.publicnode.com"
# Robinhood Chain mainnet. Browsers check the wallet and nodes against it, and
# the native client signs payments for this chain only, refusing an RPC that
# reports another.
chain_id = 4663
# Where reads of payments (listings, upload proofs, and the vault record of
# each quote an upload paid, read back after paying) go when `rpc_url` refuses
# or fails a call, in this order: ordinary reads (receipts, blocks, vault
# records) go to PublicNode (`rpc_url`), then Robinhood's own RPC, then
# ordofi; log queries go to Robinhood's RPC first, since PublicNode refuses
# the ranged `eth_getLogs` that finding a payment whose transaction hash is
# hidden needs, then PublicNode, then ordofi. ordofi is the last fallback for
# every read (Dan, 2026-10-28: "just keep it as last fallback"): it answered
# payment reads "busy" or too late in October 2026, and still answered
# -32005 "busy" on 28 October.
fallback_rpc_urls = ["https://rpc.mainnet.chain.robinhood.com", "https://rpc.ordofi.network"]
payment_token_address = "0x511f76a3de41f000ec11ea4fd212fb3587c6cef3"
payment_vault_address = "0xE0f627986c0438De0E314B644f3C8aA21D3f4f6B"
# The block the payment vault was deployed in, and that block's timestamp in
# Unix seconds (2026-10-06 20:01:56 UTC), as the chain records them. No
# payment to the vault is in an earlier block, or in a block timed earlier,
# so a listing showing an earlier block or block timestamp paid something
# else, which readers can tell without reading the chain.
payment_vault_deployment_block = 81897121
payment_vault_deployment_time = 1791316916
# The timestamp, in Unix seconds, of the block of the vault's first payment:
# block 81942857, at 2026-10-06 21:20:03 UTC, as the chain records it. The
# chain holds no log of the vault's from its deployment block until then, so
# a listing showing none of its block, block timestamp and transaction that
# its nodes date (by the hour they first stored it) more than two hours
# before then paid something else.
payment_vault_first_payment_time = 1791321603
# The root vault (DarwinRootVault), which records each wave of payments under
# one key: the address its build is deployed to through the standard CREATE2
# deployer with salt 0, for DARWIN and a leaf limit of 512. Root payments go
# here; the payment vault above stays the network's identity and keeps every
# other payment.
root_vault_address = "0xf6675722f443132b045857546E57e35360Bb03b9"
# The symbol costs are shown in.
token_symbol = "DARWIN"
