# The payment chain the client uses by default (and as --evm-network
# robinhood). Switching tokens means changing the two addresses and the
# symbol here and rebuilding; the nodes take the addresses from their node.env.
#
# Robinhood Chain mainnet (chain ID 4663), through PublicNode's free RPC. Robinhood's
# own public RPC load-balances over servers at different heights and failed
# mid-payment in testing;
# heavy users can point at their own provider with a devnet manifest.
rpc_url = "https://robinhood-rpc.publicnode.com"
# Robinhood Chain mainnet. Browsers check the wallet and nodes against it; the
# native client signs for whatever chain the RPC reports.
chain_id = 4663
# Where reads of payments (listings, upload proofs) go when `rpc_url` refuses
# or fails a call: PublicNode refuses `eth_getLogs`, which finding a payment
# whose transaction hash is hidden needs. Robinhood's own RPC comes last, for
# the reason above.
fallback_rpc_urls = ["https://rpc.ordofi.network", "https://rpc.mainnet.chain.robinhood.com"]
payment_token_address = "0x511f76a3de41f000ec11ea4fd212fb3587c6cef3"
payment_vault_address = "0xE0f627986c0438De0E314B644f3C8aA21D3f4f6B"
# The symbol costs are shown in.
token_symbol = "DARWIN"
