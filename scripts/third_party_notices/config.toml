[[appendix]]
title = "Rust standard library"
intro = """
Every Rust program links the Rust standard library. Its copyright and licence
notices, copied from the toolchain that built this binary, are in
RUST-STD-COPYRIGHT.html next to this file.
"""

[[appendix]]
title = "musl libc"
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
intro = """
This Linux build is statically linked against musl libc as shipped with Rust's
musl targets. The musl release the building toolchain uses, and that release's
COPYRIGHT file, follow.
"""
musl_from_rustc = true
