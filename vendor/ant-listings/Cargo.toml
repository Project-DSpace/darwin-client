[package]
name = "ant-listings"
version = "0.4.0"
edition = "2021"
rust-version = "1.91"
description = "Envelopes and listings for storage networks built on Autonomi's protocol: the envelope format, listing records, payment checks, upload proofs and the listings protocol"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Project-DSpace/darwin-listings"
publish = false

[dependencies]
ant-protocol = { version = "5.0.0", default-features = false }
postcard = { version = "1.1.3", features = ["use-std"] }
rmp-serde = "1"
self_encryption = "0.36"
serde = { version = "1", features = ["derive"] }
sha3 = "0.10"
thiserror = "2"

[dev-dependencies]
saorsa-core = { version = "0.29.1", default-features = false }
saorsa-pqc = { version = "0.5.2", default-features = false }
serde_json = "1"
