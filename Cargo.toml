[workspace]
# vendor/ant-listings and vendor/saorsa-core are members so their own tests run
# under this lock (`cargo test -p ant-listings`, `cargo test -p saorsa-core
# --lib`); a plain `cargo build` or `cargo test` covers the default members only.
members = ["ant-core", "ant-cli", "vendor/ant-listings", "vendor/saorsa-core"]
default-members = ["ant-core", "ant-cli"]
exclude = ["vendor/ant-protocol"]
resolver = "2"

# Dependencies are optimised in dev and test builds, while the workspace's own
# crates (ant-core, ant-cli, ant-listings) stay unoptimised for debugging. "*"
# covers darwin-node (ant-node) and vendor/ant-protocol too, which are not
# members here: the e2e tests' in-process testnets run their code. Debug builds
# of saorsa-pqc's ML-DSA checks are about 200 times slower than release ones,
# and they dominate those testnets. `cargo test` inherits this profile.
[profile.dev.package."*"]
opt-level = 2

# "*" leaves out the workspace's members, and vendor/saorsa-core is one only so
# its own tests run under this lock: it is optimised as the other dependencies
# are, as it was when it came from crates.io.
[profile.dev.package.saorsa-core]
opt-level = 2


[patch.crates-io]
# Autonomi's protocol crate with our price curve; see vendor/ant-protocol/VENDORED.md.
# A project that takes ant-core by git repeats this entry, from the same tag
# (README, "Rust Library API"): a [patch] applies only in the top-level workspace.
ant-protocol = { path = "vendor/ant-protocol" }
# saorsa-core 0.29.1, the network library, as darwin-node vendors it; see
# vendor/saorsa-core/VENDORED.md. A peer's verified direct address is dialled
# before its relay address, so the client reaches a node that is reachable
# directly without passing through another node's relay. The in-process nodes
# of the tests and devnet are built with it too, as darwin-node builds them.
# A project that takes ant-core by git repeats this entry, from the same tag
# (README, "Rust Library API"); without it, the client dials a relay first, as
# upstream's does.
saorsa-core = { path = "vendor/saorsa-core" }
# darwin-node's patched webrtc (its vendor/webrtc/VENDORED.md: closing a browser
# session cancels a DTLS handshake still in progress), from the darwin-node
# revision ant-core's tests and devnet run, so the in-process nodes are built
# as darwin-node builds them. Only builds that link darwin-node (the tests and
# the `devnet` feature) use webrtc; the `darwin` binary doesn't. The webrtc
# crate comes in through saorsa-transport's `webrtc-direct` feature, which only
# darwin-node turns on; ant-core's own `webrtc` feature is the browser protocol
# types, without it. The lock lists saorsa-transport -> webrtc because it is
# resolved with every feature, `devnet` included. A project that enables
# ant-core's `devnet` repeats this entry too (README, "Rust Library API").
webrtc = { git = "https://github.com/Project-DSpace/darwin-node.git", rev = "363640e5eb997844e34b673878d32a3c160d28ff" }
