[workspace]
# vendor/ant-listings is a member so its own tests run under this lock
# (`cargo test -p ant-listings`); a plain `cargo build` or `cargo test` covers
# the default members only.
members = ["ant-core", "ant-cli", "vendor/ant-listings"]
default-members = ["ant-core", "ant-cli"]
exclude = ["vendor/ant-protocol"]
resolver = "2"


[patch.crates-io]
# Autonomi's protocol crate with our price multiplier; see vendor/ant-protocol/VENDORED.md.
ant-protocol = { path = "vendor/ant-protocol" }
# darwin-node's patched webrtc (its vendor/webrtc/VENDORED.md: closing a browser
# session cancels a DTLS handshake still in progress), from the darwin-node
# revision ant-core's tests and devnet run, so the in-process nodes are built
# as darwin-node builds them. Only builds that link darwin-node (the tests and
# the `devnet` feature) use webrtc; the `darwin` binary doesn't.
webrtc = { git = "https://github.com/Project-DSpace/darwin-node.git", rev = "19d38d58fd3f760fedf1c83729108529ed48d232" }
