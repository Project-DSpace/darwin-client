[package]
name = "ant-cli"
version = "0.3.11+ds.9"
edition = "2021"
description = "CLI (`darwin`) for the Darwin storage network: store and retrieve data."
license = "MIT OR Apache-2.0"
repository = "https://github.com/WithAutonomi/ant-client"
readme = "../README.md"

[[bin]]
name = "darwin"
path = "src/main.rs"

# The storage-node image's node manager. Only darwin-node's image build ships it, built with
# `cargo build --release --locked -p ant-cli --bin darwin-nodes` from a darwin-client commit it
# pins. This repository's CI builds it only to check it (scripts/check-darwin-nodes.sh), and never
# packages it; a build or install of ant-cli that doesn't name `--bin darwin` makes it too.
# `darwin node` stays off in the darwin CLI. See src/bin/darwin-nodes/main.rs.
[[bin]]
name = "darwin-nodes"
path = "src/bin/darwin-nodes/main.rs"

[dependencies]
ant-core = { path = "../ant-core" }
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
colored = "3.1.1"
futures = "0.3"
hex = "0.4"
indicatif = "0.17"
rand = "0.8"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"
